name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
  unify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unify-evidence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unify.evaluate
